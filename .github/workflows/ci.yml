name: ci
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: write
jobs:
  authoring-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      # Fails the build when a section drifts back into analogy-only prose:
      # missing worked math, missing artifacts, unanswered questions, or a
      # toc.json that no longer matches the files on disk. See AUTHORING.md.
      - run: python3 tools/check_sections.py

  deploy:
    needs: authoring-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date +%Y%m%d)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force
