site_name: 'No Magic Smoke: A Brain-Friendly Guide to AMD UltraFast'
site_url: https://mehdibadjian.github.io/no-magic-smoke-fpga/
site_description: >-
  An independent, unofficial study companion to the AMD UltraFast Design Methodology.
  FPGA engineering taught Head First style, with the arithmetic left in - worked
  calculations, runnable artifacts, and answers to every question it asks.
site_author: Mehdi Badjian
copyright: >-
  Content CC BY 4.0, code MIT. An independent, unofficial guide - not affiliated with
  or endorsed by AMD, Inc.
repo_url: https://github.com/mehdibadjian/no-magic-smoke-fpga
repo_name: mehdibadjian/no-magic-smoke-fpga
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - "Chapter 1: Board Planning":
    - 1.1 Hardware Planning: sections/1.1_pcb_layout.md
    - 1.2 Power Delivery: sections/1.2_power_planning.md
    - 1.3 Clocking Architecture: sections/1.3_clocking.md
    - 1.4 I/O Planning: sections/1.4_ssi_hbm.md
  - "Chapter 2: Constraints":
    - 2.1 Defining Clocks: sections/2.1_timing_ballet.md
    - 2.2 I/O Delays: sections/2.2_constraints.md
    - 2.3 CDC Minefield: sections/2.3_cdc_minefield.md
  - "Chapter 3: Design Creation":
    - 3.1 RTL Coding: sections/3.1_rtl_coding.md
    - 3.2 IP Integration: sections/3.2_ip_integration.md
    - 3.3 Design Security: sections/3.3_security.md
    - 3.4 Verification: sections/3.4_verification.md
  - "Chapter 4: Implementation":
    - 4.1 Synthesis: sections/4.1_synthesis.md
    - 4.2 Placement: sections/4.2_placement.md
    - 4.3 Closure: sections/4.3_closure.md
  - "Chapter 5: Power & Thermal":
    - 5.1 Power Estimation: sections/5.1_power.md
    - 5.2 Thermal Design: sections/5.2_thermal.md
  - "Chapter 6: Debug & Tuning":
    - 6.1 Hardware Debugging: sections/6.1_debug.md
    - 6.2 Performance Tuning: sections/6.2_tuning.md
  - References: references.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - tables
  # The worked examples in every "Do the Math" section are LaTeX. Without
  # arithmatex the formulas render as literal $$...$$ AND the markdown parser
  # eats the underscores inside \text{} as emphasis, mangling them.
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
